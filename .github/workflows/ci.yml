# Builds and tests on the three systems the tool and the mod manager run on.
# Tests that need the game skip themselves here, as APOC_ER_STOCK is not set: game
# files are never uploaded (PLAN.md §1).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# A newer push makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude native --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The native module goes inside the game, so it is a Windows program on every
      # system; it is built below, on Windows.
      - run: cargo test --workspace --exclude native
      - run: cargo build --release -p rando
      - name: The program runs
        shell: bash
        run: target/release/apoc-rando --help
      - name: The native module builds
        if: runner.os == 'Windows'
        run: cargo build --release -p native
