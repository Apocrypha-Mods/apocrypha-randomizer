# What Elden Ring's event instructions do, as far as the game's own scripts
# show it. Worked out with `apoc-fs instructions` over all 589 scripts, with
# placeholders filled in from the calls that start each event; never from
# third-party definitions (DarkScript3's EMEDF is not used). See
# crates/fs-emevd/src/catalogue.rs.
#
# Shares below are of distinct non-zero values, as of build 25080141. Names say
# only what the evidence shows; a probable entry's name is the best reading of
# its shape, to be settled in play or against MSB.

# --- Starting events --------------------------------------------------------

[[instruction]]
bank = 2000
id = 0
name = "start_event"
confidence = "confirmed"
evidence = """
6,126 uses, 12 to 300 bytes. Word 1 is an event id in 99% of uses (3,299
distinct). Filling the started event's parameters from the words after it
makes the item-lot word of award_item_lot_b go from 45 to 620 distinct values
and still match ItemLotParam_map 95%: the reading of parameters is right."""
[[instruction.arg]]
word = 0
name = "slot"
kind = "number"
[[instruction.arg]]
word = 1
name = "event"
kind = "event_id"
[[instruction.arg]]
word = 2
name = "args"
kind = "rest"

[[instruction]]
bank = 2000
id = 6
name = "start_common_event"
confidence = "confirmed"
evidence = """
10,480 uses, same shape as start_event. Word 1 is an event id in 99% of uses,
almost all of them the shared events of common_func (90005xxx)."""
[[instruction.arg]]
word = 0
name = "slot"
kind = "number"
[[instruction.arg]]
word = 1
name = "event"
kind = "event_id"
[[instruction.arg]]
word = 2
name = "args"
kind = "rest"

