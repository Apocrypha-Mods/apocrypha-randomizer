[[instruction]]
bank = 3
id = 34
name = "if_armor"
length = 12
confidence = "probable"
evidence = """
86 uses, always 12 bytes; word 1 is always a row of EquipParamProtector (64
distinct), word 2 always -1. A condition (bank 3) on an armor piece."""
[[instruction.arg]]
word = 0
name = "condition"
kind = "packed"
[[instruction.arg]]
word = 1
name = "armor"
kind = { param = "EquipParamProtector" }

# --- Bosses -----------------------------------------------------------------

[[instruction]]
bank = 2003
id = 11
name = "boss_health_bar"
length = 16
confidence = "probable"
evidence = """
228 uses, always 16 bytes: 0 or 1; a boss's character id (the same values as
GameAreaParam rows, 82%); 0, 1 or 2; and an id in NpcName in 99% of 244
distinct values (the boss's name). The shape of showing or hiding a named
health bar in one of three places."""
[[instruction.arg]]
word = 0
name = "state"
kind = "state"
[[instruction.arg]]
word = 1
name = "boss"
kind = "entity"
[[instruction.arg]]
word = 2
name = "bar"
kind = "number"
[[instruction.arg]]
word = 3
name = "name"
kind = { text = "NpcName" }

[[instruction]]
bank = 2003
id = 12
name = "boss_defeated"
length = 8
confidence = "probable"
evidence = """
167 uses, always 8 bytes: word 0 is a GameAreaParam row in 95% of 219 distinct
values, word 1 a small number (15..27). Acts on a boss area; likely what marks
its defeat (banner, reward)."""
[[instruction.arg]]
word = 0
name = "boss_area"
kind = { param = "GameAreaParam" }
[[instruction.arg]]
word = 1
name = "kind"
kind = "number"

