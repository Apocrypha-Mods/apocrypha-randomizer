# What Elden Ring's event instructions do, as far as the game's own scripts
# show it. Worked out with `apoc-fs instructions` over all 589 scripts, with
# placeholders filled in from the calls that start each event; never from
# third-party definitions (DarkScript3's EMEDF is not used). See
# crates/fs-emevd/src/catalogue.rs.
#
# Shares below are of distinct non-zero values, as of build 25080141. Names say
# only what the evidence shows; a probable entry's name is the best reading of
# its shape, to be settled in play or against MSB.

# --- Starting events --------------------------------------------------------

[[instruction]]
bank = 2000
id = 0
name = "start_event"
confidence = "confirmed"
evidence = """
6,126 uses, 12 to 300 bytes. Word 1 is an event id in 99% of uses (3,299
distinct). Filling the started event's parameters from the words after it
makes the item-lot word of award_item_lot_b go from 45 to 620 distinct values
and still match ItemLotParam_map 95%: the reading of parameters is right."""
[[instruction.arg]]
word = 0
name = "slot"
kind = "number"
[[instruction.arg]]
word = 1
name = "event"
kind = "event_id"
[[instruction.arg]]
word = 2
name = "args"
kind = "rest"

[[instruction]]
bank = 2000
id = 6
name = "start_common_event"
confidence = "confirmed"
evidence = """
10,480 uses, same shape as start_event. Word 1 is an event id in 99% of uses,
almost all of them the shared events of common_func (90005xxx)."""
[[instruction.arg]]
word = 0
name = "slot"
kind = "number"
[[instruction.arg]]
word = 1
name = "event"
kind = "event_id"
[[instruction.arg]]
word = 2
name = "args"
kind = "rest"

# --- Flags ------------------------------------------------------------------

[[instruction]]
bank = 2003
id = 66
name = "set_flag"
length = 12
confidence = "confirmed"
evidence = """
4,601 uses, always 12 bytes. Word 1 takes 4,768 distinct values including
boss defeat flags (GameAreaParam) and the flags of every flag field in the
param layouts; word 2 is only ever 0 or 1. The shape of setting a flag off or
on."""
[[instruction.arg]]
word = 0
name = "kind"
kind = "number"
[[instruction.arg]]
word = 1
name = "flag"
kind = "flag"
[[instruction.arg]]
word = 2
name = "state"
kind = "state"

[[instruction]]
bank = 3
id = 0
name = "if_flag"
length = 8
confidence = "confirmed"
evidence = """
6,834 uses, always 8 bytes: packed condition bytes (257, 511, …), then a flag
(4,831 distinct values, boss defeat flags among them)."""
[[instruction.arg]]
word = 0
name = "condition"
kind = "packed"
[[instruction.arg]]
word = 1
name = "flag"
kind = "flag"

[[instruction]]
bank = 1003
id = 2
name = "branch_on_flag"
length = 8
confidence = "probable"
evidence = """
2,313 uses, always 8 bytes: packed bytes (256, 131328, …), then 1,701
distinct values among them boss defeat flags. A control-flow instruction
(bank 1003) that tests a flag; what it branches to is not settled."""
[[instruction.arg]]
word = 0
name = "condition"
kind = "packed"
[[instruction.arg]]
word = 1
name = "flag"
kind = "flag"

[[instruction]]
bank = 1003
id = 101
name = "branch_on_flag_b"
length = 8
confidence = "probable"
evidence = """
2,235 uses, always 8 bytes: packed bytes (257, 256, 258, …), then 2,752
distinct values among them boss defeat flags. Like branch_on_flag; how the two
differ is not settled."""
[[instruction.arg]]
word = 0
name = "condition"
kind = "packed"
[[instruction.arg]]
word = 1
name = "flag"
kind = "flag"

# --- Items ------------------------------------------------------------------

[[instruction]]
bank = 2003
id = 4
name = "award_item_lot"
