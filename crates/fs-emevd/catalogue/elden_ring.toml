evidence = "26 uses, always 4 bytes; every value (21 distinct) is a row of ItemLotParam_map."
[[instruction.arg]]
word = 0
name = "item_lot"
kind = { param = "ItemLotParam_map" }

[[instruction]]
bank = 2003
id = 36
name = "award_item_lot_b"
length = 4
confidence = "confirmed"
evidence = """
205 uses, always 4 bytes; 95% of its 620 distinct values (with placeholders
filled in) are rows of ItemLotParam_map. How it differs from award_item_lot is
not settled."""
[[instruction.arg]]
word = 0
name = "item_lot"
kind = { param = "ItemLotParam_map" }

[[instruction]]
bank = 1000
id = 6
name = "uses_item_lot"
length = 12
confidence = "probable"
evidence = """
29 uses, always 12 bytes, nearly all filled in by calls: word 1 is a row of
ItemLotParam_map in 95% of 273 distinct values. A control-flow instruction
(bank 1000) that tests something about an item lot."""
[[instruction.arg]]
word = 1
name = "item_lot"
kind = { param = "ItemLotParam_map" }

[[instruction]]
bank = 2004
id = 76
name = "boss_item_lot"
length = 8
confidence = "probable"
evidence = """
13 uses, filled in by calls 215 times: word 0 takes boss area ids (the values
