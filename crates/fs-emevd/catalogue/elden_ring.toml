# --- Control flow -------------------------------------------------------------
#
# Conditions (banks 0 to 999) put what they test in a condition group: byte 0
# of their first word, always between -15 and 15 (21,000 uses). Group 0 is
# the event itself: it waits there until the condition holds. Other groups
# collect conditions until an instruction below evaluates them; a negative
# group holds when any of its conditions does, a positive one when all do. The
# evidence: quest stages are cleared as a range (set_flag_range) and then one
# is set, so two stages of one range are never on together; 98 of 597
# negative groups ask for two such stages, against 10 of 1,144 positive ones.
# Labels are bank 1014: the instruction's id is the label.

[[instruction]]
bank = 0
id = 0
name = "combine_group"
length = 4
confidence = "probable"
evidence = """
6,852 uses, always 4 bytes: byte 0 a group (-15 to 15, 0 most often), byte 1
a state (0 or 1), byte 2 another group. Puts whether the second group is in
that state into the first; into group 0, the event waits for it."""
[[instruction.arg]]
word = 0
name = "condition"
kind = "packed"
bytes = ["group", "state", "source"]

