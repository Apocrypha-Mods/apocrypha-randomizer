# --- Conditions named by the exe (2026-11-03) ----------------------------------
#
# Each condition handler in eldenring.exe 2.7.2 builds an object whose class the
# exe names through its own run-time type data (EcTestChrDead, EcTestHasItem, ...).
# The bank's handler is found from the dispatcher at +0x569040 (bank n at the
# table's +8n), each id's case from that handler's jump table, and the class from
# the vtable the case's constructor stores. `scratch/py/ec.py`, not committed, did
# this read-only; no game ran. The words' meanings are from the scripts' data, and
# entity and region words are checked against the maps (real_maps.rs). A
# comparison word holds 0 ==, 1 !=, 2 >, 3 <, 4 >=, 5 <=, as read for 3[10].

