237 distinct values in event-flag-like ranges, 0 in 816 rows. 61% occur in the
event scripts, 48 tested or set directly, so these are event flags. Likely
gates whether the item is on sale; to be confirmed in play."""

[[layout.field]]
name = "sell_quantity"
offset = 0x14
kind = "u8"
confidence = "probable"
evidence = """
255 in 606 rows, then 1 (580), 3, 5, 10, 2: 255 reads as unlimited stock and
the rest as a limited count. To be confirmed in play."""

[[layout.field]]
name = "equip_type"
offset = 0x17
kind = "u8"
confidence = "confirmed"
evidence = "Values 0..5; each picks the table equip_id refers to (see equip_id). 5 appears once."
values = { "0" = "weapon", "1" = "protector", "2" = "accessory", "3" = "goods", "4" = "gem" }

# ---------------------------------------------------------------------------
# Only the fields settled so far. HP, runes and team are not: the obvious
# candidates (0x24 for HP, 0x2C for runes) do not line up with bosses' known
# values, and bosses such as Margit have no row carrying their name. They wait
# for the enemy randomizer, where the spec and in-game checks can settle them.
[[layout]]
type = "NPC_PARAM_ST"
row_size = 736
tables = ["NpcParam"]

[[layout.field]]
name = "name_id"
offset = 0x0C
kind = "i32"
confidence = "confirmed"
evidence = """
0 in 6,325 rows; 213 of the other 223 distinct values are ids in the game's
NpcName text (e.g. Rennala, Queen of the Full Moon on rows 20300000..20310124)."""

[[layout.field]]
name = "item_lot_enemy_id"
offset = 0x30
kind = "i32"
confidence = "confirmed"
evidence = """
-1 in 2,549 rows; 98% of the other 1,376 distinct values are row ids of
ItemLotParam_enemy: the drop an enemy gives."""

[[layout.field]]
name = "item_lot_map_id"
offset = 0x34
kind = "i32"
confidence = "confirmed"
evidence = """
-1 in 6,903 rows; every one of the other 59 distinct values is a row id of
ItemLotParam_map: a lot handed out once, such as a boss's reward."""

# ---------------------------------------------------------------------------
# Starting equipment. Rows 3000..3009 are the ten starting classes; the other
# 3,263 rows are NPCs, phantoms and rows that look unused, and some of those
# carry values that are not items (small numbers like 100..137 in the weapon
# slots of rows 7500 on). The classes' own starting goods are almost empty
# (one item, 115), so flasks and other starting items come from elsewhere.
[[layout]]
type = "CHARACTER_INIT_PARAM"
row_size = 320
tables = ["CharaInitParam"]

[[layout.field]]
name = "weapon"
offset = 0x10
kind = "i32"
count = 4
stride = 4
confidence = "confirmed"
evidence = """
In every class row (3000..3009) each value is an EquipParamWeapon row, or one
once its affinity and level (the last four digits) are cleared; -1 is empty.
Across all rows 76..93% match the same way, the misses being the NPC and
unused rows described above. Which slot is which hand is not settled; in the
class rows slots 2 and 3 hold the 30-34 million ids."""

[[layout.field]]
name = "weapon_extra"
offset = 0x108
kind = "i32"
count = 2
stride = 4
confidence = "probable"
evidence = """
Values shaped like weapon ids (3000000, 33000000, 24000000, -1 for none);
84..88% of rows match EquipParamWeapon by base id. Empty in every class row."""

[[layout.field]]
name = "protector"
offset = 0x20
kind = "i32"
count = 4
stride = 4
confidence = "confirmed"
evidence = """
93..97% of values are EquipParamProtector rows, and slot i holds ids whose
hundreds digit is i (x000, x100, x200, x300): one slot per armor piece, in the
order the ids number them. Every class row keeps to this; across the table 11
of 11,880 armor values do not, all of them other ids in the second slot of NPC
rows (e.g. 702000 on row 6040)."""

[[layout.field]]
name = "ammo"
offset = 0x30
kind = "i32"
count = 4
stride = 4
confidence = "confirmed"
evidence = """
90..100% of values are EquipParamWeapon rows, and the commonest are
50000000/50010000 and 52000000/52020000 (arrows and bolts by their range)."""

[[layout.field]]
name = "accessory"
offset = 0x40
kind = "i32"
count = 4
stride = 4
confidence = "confirmed"
evidence = "Every value other than -1 is an EquipParamAccessory row (100% in all four slots)."

[[layout.field]]
name = "goods_a"
offset = 0x54
kind = "i32"
count = 3
stride = 4
confidence = "confirmed"
evidence = "Every value other than -1 is an EquipParamGoods row. What sets these three apart from the other goods slots is not known."

[[layout.field]]
name = "magic"
offset = 0x60
kind = "i32"
count = 7
stride = 4
confidence = "confirmed"
evidence = "93..100% of the values other than -1 are rows of Magic, in each of the seven slots."

[[layout.field]]
name = "goods"
offset = 0x7C
kind = "i32"
count = 10
stride = 4
confidence = "confirmed"
evidence = "93..98% of the values other than -1 are EquipParamGoods rows, in each of the ten slots."

[[layout.field]]
name = "goods_b"
offset = 0x114
kind = "i32"
count = 6
stride = 4
confidence = "confirmed"
evidence = """
90..100% of the values other than -1 are EquipParamGoods rows. Every class
row has 115 in the first slot and nothing else."""

# ---------------------------------------------------------------------------
[[layout]]
type = "EQUIP_PARAM_GOODS_ST"
row_size = 176
tables = ["EquipParamGoods"]

[[layout.field]]
name = "goods_type"
offset = 0x22
kind = "u8"
confidence = "confirmed"
evidence = """
Read off the game's own item names (`apoc-fs labels … EquipParamGoods
GoodsName`): every item with a given value is of one kind. 3 holds the Great
Runes and quest items such as Deathroot and Shabriri Grape, but also every
sorcery, so it is not a clean key-item marker: the logic graph lists its key
items by id."""
values = { "0" = "other: multiplayer items, consumables, pots, flasks", "1" = "crafting materials", "2" = "upgrade materials: Golden Seed, Sacred Tear, smithing stones, gloveworts", "3" = "Great Runes, quest items and sorceries", "4" = "incantations", "6" = "letters, maps, paintings and notes", "7" = "tutorials (About …)", "15" = "unnamed, unused" }

# ---------------------------------------------------------------------------
[[layout]]
type = "EQUIP_PARAM_WEAPON_ST"
row_size = 664
tables = ["EquipParamWeapon"]

[[layout.field]]
name = "reinforce_type"
offset = 0xDA
kind = "u16"
confidence = "confirmed"
evidence = """
32 of its 33 values are rows of ReinforceParamWeapon: the first row of the
upgrade path, whose level n is that id plus n. It separates weapons upgraded
with somber stones (Moonveil, Rivers of Blood: 2200) from regular ones
(Longsword, Dagger: 0, affinities 100..1200). Whether a path is somber is read
from ReinforceParamWeapon itself (its last level is +10, not +25), not from a
list of values."""

