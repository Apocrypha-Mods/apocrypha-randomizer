# Field layouts for the Elden Ring param tables the randomizer touches.
#
# Worked out from the game's own regulation.bin (build 25080141, regulation
# 11711000) with `apoc-fs columns`, never from Paramdex or any other tool's
# definitions. See crates/fs-param/src/layout.rs for the rules:
#
# - confirmed: the data settles it, and fs-tool/tests/real_files.rs checks it;
# - probable:  suggestive, to be settled by EMEVD, MSB or play.
#
# Offsets are bytes into a row. A repeated field has `count` values `stride`
# bytes apart. Bytes nobody uses yet are not listed.

# ---------------------------------------------------------------------------
[[layout]]
type = "ITEMLOT_PARAM_ST"
row_size = 152
tables = ["ItemLotParam_map", "ItemLotParam_enemy"]

[[layout.field]]
name = "item_id"
offset = 0x00
kind = "i32"
count = 8
stride = 4
confidence = "confirmed"
evidence = """
Eight slots, later ones ever sparser (map: 185 empty in slot 0, 5,549 in slot
1, 5,590 in slot 7). Grouped by the matching item_category, slot 0's values are
row ids of one table each: category 1 in EquipParamGoods (94%), 2 in
EquipParamWeapon (93%), 3 in EquipParamProtector (99%), 4 in
EquipParamAccessory (100%), 5 in EquipParamGem (100%), 6 in
EquipParamCustomWeapon (100%). The weapon ids that miss are base ids plus an
upgrade level (checked by the real-file test)."""

[[layout.field]]
name = "item_category"
offset = 0x20
kind = "i32"
count = 8
stride = 4
confidence = "confirmed"
evidence = """
Values 0..6, zero in exactly the slots where item_id is zero from slot 1 on.
Each value picks the table item_id refers to (see item_id)."""
values = { "0" = "none", "1" = "goods", "2" = "weapon", "3" = "protector", "4" = "accessory", "5" = "gem", "6" = "custom weapon" }

[[layout.field]]
name = "weight"
offset = 0x40
kind = "u16"
count = 8
stride = 2
confidence = "confirmed"
evidence = """
Eight u16 values, one per slot. Map lots: slot 0 is 1000 in 5,385 rows. Enemy
lots: slot 0 is the chance of nothing (e.g. 985) and slot 1 the drop (15). A
row's weights add up to 1000 in almost every row (checked by the real-file
test): a chance per slot in tenths of a percent."""

[[layout.field]]
name = "get_item_flag"
offset = 0x80
kind = "u32"
confidence = "confirmed"
evidence = """
The flag that records a treasure as picked up. Of the 3,558 lots the maps place
as treasure (MSB event type 4), 3,425 carry a flag and only two flags are
shared, so each treasure has its own. Only 12% of all these flags occur in the
event scripts, so picking the treasure up sets it, not a script. Mostly zero for enemy lots
(4,891 of 5,135), as repeatable drops would be. Checked by fs-tool's
real_maps.rs."""

[[layout.field]]
name = "count"
offset = 0x8A
kind = "u8"
count = 8
stride = 1
confidence = "confirmed"
evidence = """
Eight bytes, one per slot, zero in exactly the rows where that slot's item_id
is zero for slots 1..7 (5,549, 5,560, 5,578, 5,588, 5,590, 5,590, 5,590 in the
map lots). Mostly 1, then 3, 2, 5: how many of the item."""

