# Elden Ring's areas, how they connect, and what it takes to get through.
#
# Authored here from general knowledge of the game (PLAN.md §1, rule 4), not
# taken from another randomizer. First draft, 2026-10-29, for review in play:
# every claim marked `sure = false` is one to check, and its note says what.
#
# - An area is a set of graces (by their in-game names, `name@mAA_BB` where a
#   name is shared) and of maps (by prefix). Item locations go to the area of
#   their map, else to the nearest grace's (crates/logic/src/lib.rs).
# - An edge opens `to` from `from` (and back, unless `oneway`) once its
#   `items` are held, its `bosses` beaten, and `n` of its `any.items` held.
# - A `place` puts a location with no map (the grace menu's gifts, NPCs of
#   the open world) in an area, optionally behind its own need.
#
# `apoc-fs logic <game>` checks every name against the game and walks the
# vanilla game from the start.

start = "stranded_graveyard"
goal = { bosses = ["Elden Beast"] }

