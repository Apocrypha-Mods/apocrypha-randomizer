# Elden Ring's areas, how they connect, and what it takes to get through.
#
# Authored here from general knowledge of the game (PLAN.md §1, rule 4), not
# taken from another randomizer. First draft, 2026-10-29, for review in play:
# every claim marked `sure = false` is one to check, and its note says what.
#
# - An area is a set of graces (by their in-game names, `name@mAA_BB` where a
#   name is shared) and of maps (by prefix). Item locations go to the area of
#   their map, else to the nearest grace's (crates/logic/src/lib.rs).
# - An edge opens `to` from `from` (and back, unless `oneway`) once its
#   `items` are held, its `bosses` beaten, and `n` of its `any.items` held.
# - A `place` puts a location with no map (the grace menu's gifts, NPCs of
#   the open world) in an area, optionally behind its own need.
# - An `unused` entry rules out a location the game has but never gives in
#   play, so the randomizer neither counts on it nor puts anything there.
# - `shop_rows` place, or rule out, ranges of shop rows that no merchant's
#   talk script opens.
# - `currency` names the item a shop price is paid in, by ShopLineupParam
#   `currency`, where it is not runes.
# - An `on_sale` entry says what turns on a flag that puts shop rows on sale,
#   where the model does not tie it to a boss or an item handed over in talk.
#   A row whose flag nothing explains is never counted as got.
#
# `apoc-fs logic <game>` checks every name against the game and walks the
# vanilla game from the start.

start = "stranded_graveyard"
goal = { bosses = ["Elden Beast"] }

# --- The base game: the start -------------------------------------------------

# Past the burning of the Erdtree. Not checked quest by quest: leaving these
# out of a quest item's slots only ever costs choice, never a finishable seed.
no_return = ["farum_azula", "ashen_capital", "elden_throne"]

# Shut for good while the game goes on, so nothing that must be had is put there.
# Burning the Erdtree replaces the capital, and what is reached through it goes with
# it. The East Altus tower's door (m34_14 event 34142550) and a door in the
# Shunning-Grounds (m35_00 event 35002504) test flag 400001, the pick-up flag of
# Melina's gift, which she can no longer give once the tree has burned. That flag
# stays with her slot, whatever the slot now gives. Doubtful ways take the stricter
# reading: this only narrows where keys may land.
# The Divine Towers' restored runes (event 90005110) wait on the tower's boss beaten
# and name the rune; the area map sees neither, so nothing that must be had goes there.
uncertain_sources = ["event 90005110"]
# Not listed, from general knowledge and the edges below, with no script read for it:
# Volcano Manor, whose way in from Mt. Gelmir needs nothing, so its quest's end can cost
# talk gifts, which are marked missable, but not the area; and Farum Azula, reached once
# the Forge is lit, whose graces stay. It is `no_return` for quest items all the same.
closes = [
    "leyndell", "subterranean_shunning_grounds", "divine_tower_west_altus",
    "divine_tower_east_altus", "isolated_divine_tower",
]

# The chapel's door opens only to those carrying this finger, and the body
# beside the start is the one slot before that door. Seen in play, 2026-10-30:
# seed 1 moved it away and the character could not leave the chapel.
fixed = [
    "Tarnished's Wizened Finger",
    # Nova's choices from play, 2026-10-30: the flasks, Torrent from Melina, and
    # the Crafting Kit where Kalé sells it.
    "Flask of Crimson Tears",
    "Flask of Cerulean Tears",
    "Flask of Wondrous Physick",
    "Spectral Steed Whistle",
    "Crafting Kit",
]

