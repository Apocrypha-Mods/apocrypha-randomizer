[package]
name = "addon"
description = "The mod manager add-on's WebAssembly module: builds a seed from game files the page hands it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fs-bytes.workspace = true
# The game's files are Kraken-compressed. Behind a feature until the legal
# opinion on oozextract (PLAN.md §6): this add-on must not be published before it.
fs-dcx = { workspace = true, features = ["kraken"] }
fs-dvdbnd.workspace = true
fs-param.workspace = true
gamedata.workspace = true
rando.workspace = true
serde.workspace = true
serde_json.workspace = true
